name: DWI foundation checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: FastAPI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test dependencies
        run: python -m pip install -e ".[dev]"
        working-directory: backend
      - name: Test API
        run: python -m pytest -q
        working-directory: backend

  frontend:
    name: React build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  database:
    name: PostgreSQL smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local database
        run: docker compose up -d db
      - name: Verify PostgreSQL responds
        shell: bash
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U dwi -d dwi; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - name: Cleanup
        if: always()
        run: docker compose down -v
